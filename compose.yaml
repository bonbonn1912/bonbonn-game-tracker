name: bonbonn-game-tracker

services:
  app:
    container_name: bonbonn-gt
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:12000:12000"
    environment:
      PORT: "12000"
      ADMIN_HOST: ${ADMIN_HOST:-admin.faceitlobby.com}
      WEBHOOK_HOST: ${WEBHOOK_HOST:-webhook.faceitlobby.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      FACEIT_API_KEY: ${FACEIT_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      apiKey: ${FACEIT_API_KEY:-}
    healthcheck:
      test: ["CMD", "/server", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      postgres:
      monitoring:
        aliases:
          - bonbonn-api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  postgres:
    name: postgres_prod
    external: true
  monitoring:
    external: true
