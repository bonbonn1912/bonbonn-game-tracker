name: CI & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    name: Go Vet & Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: bonbonn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d bonbonn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_TEST_URL: postgres://test:ci-test-password@127.0.0.1:5432/bonbonn_test?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Go Vet
        run: go vet ./...

      - name: Go Unit Tests
        run: go test -race -v ./...

  deploy:
    name: Deploy via SSH
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        env:
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT || 22 }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: GITHUB_SHA
          script: |
            set -euo pipefail

            DEPLOY_DIR="/opt/faceit-game-tracker"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            echo "=== Deploying bonbonn-game-tracker ==="
            echo "Target commit SHA: ${GITHUB_SHA}"
            echo "Target directory: ${DEPLOY_DIR}"

            mkdir -p "${DEPLOY_DIR}"
            cd "${DEPLOY_DIR}"

            # Safe initialization for existing non-empty directory with host .env
            if [ ! -d .git ]; then
              echo "Initializing git repository in ${DEPLOY_DIR}..."
              git init
              git remote add origin "${REPO_URL}"
            else
              git remote set-url origin "${REPO_URL}" || true
            fi

            echo "Fetching ${GITHUB_SHA} from origin..."
            git fetch --depth 1 origin "${GITHUB_SHA}" || git fetch origin "${GITHUB_SHA}" || git fetch origin

            echo "Checking out ${GITHUB_SHA}..."
            # NEVER execute git clean or destructive reset that removes untracked server .env
            git checkout --force "${GITHUB_SHA}"

            # Verify host .env exists without echoing secret contents
            if [ ! -f .env ]; then
              echo "ERROR: ${DEPLOY_DIR}/.env file not found on host. Deployment aborted."
              exit 1
            fi

            echo "Building application image with docker compose..."
            docker compose build

            echo "Starting containers with docker compose up -d --wait..."
            docker compose up -d --wait

            # Keep the dedicated webhook hostname configured in Caddy while preserving
            # the host's existing API, admin, and unrelated site configuration.
            CADDY_CONTAINER="$(docker ps --format '{{.Names}} {{.Image}}' | awk 'tolower($0) ~ /caddy/ {print $1; exit}')"
            CADDYFILE=""
            CADDY_RELOAD_MODE="systemd"
            CADDYFILE_IN_CONTAINER="/etc/caddy/Caddyfile"
            if [ -n "${CADDY_CONTAINER}" ]; then
              CADDY_RELOAD_MODE="container"
              CADDYFILE="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/etc/caddy/Caddyfile"}}{{.Source}}{{end}}{{end}}' "${CADDY_CONTAINER}")"
              if [ -z "${CADDYFILE}" ]; then
                CADDY_DIR_MOUNT="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/etc/caddy"}}{{.Source}}{{end}}{{end}}' "${CADDY_CONTAINER}")"
                if [ -n "${CADDY_DIR_MOUNT}" ]; then
                  CADDYFILE="${CADDY_DIR_MOUNT}/Caddyfile"
                fi
              fi
            else
              CADDYFILE="/etc/caddy/Caddyfile"
              if ! sudo test -f "${CADDYFILE}"; then
                CADDYFILE="$(sudo find /etc /opt /srv /root /home /usr/local/etc -type f -name Caddyfile -print 2>/dev/null | while IFS= read -r candidate; do
                  if sudo grep -Fq 'api.faceitlobby.com' "${candidate}"; then
                    echo "${candidate}"
                    break
                  fi
                done || true)"
              fi
            fi
            if [ -z "${CADDYFILE}" ] || { [ "${CADDY_RELOAD_MODE}" = "container" ] && ! sudo test -f "${CADDYFILE}"; } || { [ "${CADDY_RELOAD_MODE}" = "systemd" ] && ! sudo test -f "${CADDYFILE}"; }; then
              echo "ERROR: Could not locate the active Caddyfile."
              echo "Running Caddy containers:"
              docker ps --format '{{.Names}} {{.Image}}' | grep -i caddy || true
              echo "Candidate Caddyfiles:"
              sudo find /etc /opt /srv /root /home /usr/local/etc -type f -name Caddyfile -print 2>/dev/null || true
              exit 1
            fi
            if ! sudo grep -Fq 'webhook.faceitlobby.com {' "${CADDYFILE}"; then
              CADDY_BACKUP="${CADDYFILE}.bak.$(date +%Y%m%d%H%M%S)"
              sudo cp "${CADDYFILE}" "${CADDY_BACKUP}"
              sudo tee -a "${CADDYFILE}" >/dev/null <<'CADDY'

            webhook.faceitlobby.com {
                log access
                encode zstd gzip
                reverse_proxy bonbonn-api:12000
            }
            CADDY
              if [ "${CADDY_RELOAD_MODE}" = "container" ]; then
                if ! docker exec "${CADDY_CONTAINER}" caddy validate --config "${CADDYFILE_IN_CONTAINER}" --adapter caddyfile; then
                  sudo cp "${CADDY_BACKUP}" "${CADDYFILE}"
                  echo "ERROR: Caddy rejected the webhook host configuration; restored the previous file."
                  exit 1
                fi
              elif ! sudo caddy validate --config "${CADDYFILE}" --adapter caddyfile; then
                sudo cp "${CADDY_BACKUP}" "${CADDYFILE}"
                echo "ERROR: Caddy rejected the webhook host configuration; restored the previous file."
                exit 1
              fi
            else
              if [ "${CADDY_RELOAD_MODE}" = "container" ]; then
                docker exec "${CADDY_CONTAINER}" caddy validate --config "${CADDYFILE_IN_CONTAINER}" --adapter caddyfile
              else
                sudo caddy validate --config "${CADDYFILE}" --adapter caddyfile
              fi
            fi
            if [ "${CADDY_RELOAD_MODE}" = "container" ]; then
              docker exec "${CADDY_CONTAINER}" caddy reload --config "${CADDYFILE_IN_CONTAINER}" --adapter caddyfile
            else
              sudo systemctl reload caddy
            fi

            WEBHOOK_HEALTHY="false"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --max-time 5 https://webhook.faceitlobby.com/healthz >/dev/null; then
                WEBHOOK_HEALTHY="true"
                break
              fi
              sleep 5
            done
            if [ "${WEBHOOK_HEALTHY}" != "true" ]; then
              echo "ERROR: webhook.faceitlobby.com did not become healthy over HTTPS."
              exit 1
            fi

            echo "=== Deployment successful ==="
            docker compose ps
